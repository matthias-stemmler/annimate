name: Audit (Cargo)

on:
  push:
    paths:
      - '**/Cargo.lock'
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2026-0194, RUSTSEC-2026-0195: Two quick-xml DoS advisories,
          # fixed in >=0.41.0. Only reachable via graphannis, which declares
          # ^0.28, so there is nothing to bump to. Both target a server fed
          # untrusted XML; here the only XML is corpus files the user chose to
          # import. Remove once graphannis updates to quick-xml >=0.41.0.
          #
          # RUSTSEC-2026-0253: An lru use-after-free advisory, fixed in >=0.18.2.
          # Only reachable via graphannis, which declares ^0.17, so there is
          # nothing to bump to. It needs a key type whose Drop panics while
          # unwinding is caught; graphannis only uses NodeID and
          # (NodeID, NodeID) keys, which do not implement Drop at all.
          # Remove once graphannis updates to lru >=0.18.2.
          #
          # RUSTSEC-2026-0367, RUSTSEC-2026-0368, RUSTSEC-2026-0369: Three zip
          # advisories about symlinks and Unix permission bits during
          # extraction, fixed in >=9.0.0. Reachable via graphannis, which
          # declares ^8.5.1, and tauri-plugin-updater, which declares ^4, so
          # there is nothing to bump to. graphannis never calls extract() but
          # copies entries into plain files via enclosed_name(), so no symlinks
          # or permissions are applied; tauri-plugin-updater only extracts on
          # Windows, and only signature-verified update archives. Remove once
          # both update to zip >=9.0.0.
          #
          # RUSTSEC-2026-0391, RUSTSEC-2026-0398, RUSTSEC-2026-0403: Three
          # zstd/zstd-safe advisories, fixed in zstd >=0.14.3 and zstd-safe
          # >=8.2.0. The old versions are only reachable via graphannis through
          # zip ^8, which declares zstd ^0.13, so there is nothing to bump to.
          # zip never uses with_context, and enables zstd without default
          # features, so the seekable and legacy code paths of the other two
          # are not compiled in. Remove once graphannis updates to zip >=9.0.0.
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195,RUSTSEC-2026-0253,RUSTSEC-2026-0367,RUSTSEC-2026-0368,RUSTSEC-2026-0369,RUSTSEC-2026-0391,RUSTSEC-2026-0398,RUSTSEC-2026-0403
