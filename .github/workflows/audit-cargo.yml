name: Audit (Cargo)

on:
  push:
    paths:
      - '**/Cargo.lock'
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Two quick-xml DoS advisories, fixed in >=0.41.0. Only reachable via
          # graphannis, which declares ^0.28, so there is nothing to bump to.
          # Both target a server fed untrusted XML; here the only XML is corpus
          # files the user chose to import.
          #
          # Remove once graphannis updates to quick-xml >=0.41.0.
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195
