packages:
  - '.'
  - 'webdriver'

allowBuilds:
  '@tailwindcss/oxide': true
  edgedriver: true
  esbuild: true
  geckodriver: true

autoInstallPeers: false
blockExoticSubdeps: true

catalog:
  '@babel/core': ^8.1.2
  '@dnd-kit/core': ^6.3.1
  '@dnd-kit/modifiers': ^9.0.0
  '@dnd-kit/sortable': ^10.0.0
  '@dnd-kit/utilities': ^3.2.2
  '@eslint/js': ^10.0.1
  '@radix-ui/react-checkbox': ^1.4.1
  '@radix-ui/react-collapsible': ^1.2.1
  '@radix-ui/react-dialog': ^1.3.1
  '@radix-ui/react-dropdown-menu': ^2.2.1
  '@radix-ui/react-label': ^2.1.17
  '@radix-ui/react-menubar': ^1.2.1
  '@radix-ui/react-progress': ^1.2.1
  '@radix-ui/react-radio-group': ^1.5.1
  '@radix-ui/react-scroll-area': ^1.4.0
  '@radix-ui/react-select': ^2.4.1
  '@radix-ui/react-separator': ^1.2.0
  '@radix-ui/react-slot': ^1.5.0
  '@radix-ui/react-tabs': ^1.2.1
  '@radix-ui/react-toast': ^1.3.1
  '@radix-ui/react-tooltip': ^1.4.1
  '@rolldown/plugin-babel': ^0.3.1
  '@tailwindcss/typography': ^0.5.20
  '@tailwindcss/vite': ^4.3.5
  '@tanstack/eslint-plugin-query': ^5.107.1
  '@tanstack/react-query': ^5.107.1
  '@tauri-apps/api': ^2.12.4
  '@tauri-apps/cli': ^2.12.4
  '@tauri-apps/plugin-dialog': ^2.8.4
  '@tauri-apps/plugin-opener': ^2.7.3
  '@tauri-apps/plugin-process': ^2.4.0
  '@tauri-apps/plugin-updater': ^2.14.1
  '@tauri-apps/plugin-window-state': ^2.5.0
  '@testing-library/dom': ^10.4.2
  '@testing-library/react': ^16.3.3
  '@types/babel__core': ^7.20.5
  '@types/node': ^26.6.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  # Native TS 7 `tsc` for build/check; the `typescript` entry below stays on v6
  # until typescript-eslint supports v7: https://github.com/typescript-eslint/typescript-eslint/issues/12518
  '@typescript/native': 'npm:typescript@^7.0.2'
  '@vitejs/plugin-react': ^6.3.0
  '@wdio/cli': ^10.2.0
  '@wdio/globals': ^10.2.0
  '@wdio/local-runner': ^10.2.0
  '@wdio/mocha-framework': ^10.2.0
  '@wdio/spec-reporter': ^10.2.0
  '@wdio/types': ^10.2.0
  babel-plugin-react-compiler: ^1.0.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  eslint: ^10.15.0
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.8
  jsdom: ^31.0.1
  lucide-react: ^1.73.0
  prettier: ^3.10.1
  prettier-plugin-tailwindcss: ^0.8.1
  react: ^19.3.1
  react-dom: ^19.3.1
  react-markdown: ^10.1.0
  react-resizable-panels: ^4.23.0
  react-router: ^8.5.1
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.5
  tailwindcss-animate: ^1.0.7
  tsx: ^4.23.15
  typescript: 'npm:@typescript/typescript6@^6.0.2'
  typescript-eslint: ^8.72.2
  vite: ^8.3.8
  vite-plugin-svgr: ^5.2.0
  vitest: ^5.1.0
  zustand: ^5.1.0

catalogPrune: true
# Keep in sync with minimumReleaseAge in renovate.json
minimumReleaseAge: 1440

strictDepBuilds: true
verifyDepsBeforeRun: prompt

overrides:
  # GHSA-3g3m-2fjr-6pw4: A glob AbortSignal cancellation bypass advisory,
  # fixed in >=14.0.2. Only reachable via mocha (through
  # @wdio/mocha-framework), which requires ^13. Dev-only (WebDriver tests).
  # Remove once mocha updates to glob >=14.0.2.
  glob@>=9.0.0 <14.0.2: ^14.0.2
  # GHSA-g3hv-75wg-m249: A minimatch globparts amplification DoS advisory,
  # fixed in >=11.0.1. Only reachable via eslint, mocha, glob,
  # @typescript-eslint/typescript-estree and readdir-glob, which require ^10.
  # Dev-only (linting, WebDriver tests). Remove once they update to
  # minimatch >=11.0.1.
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  # GHSA-rj75-hqrm-r3gf: A postcss-selector-parser CPU exhaustion advisory,
  # fixed in >=7.1.6. Only reachable via @tailwindcss/typography, which pins
  # exactly 6.0.10. The built CSS is byte-identical with 7.x. Remove once
  # @tailwindcss/typography updates to postcss-selector-parser >=7.1.6.
  postcss-selector-parser@6.0.10: ^7.1.6
